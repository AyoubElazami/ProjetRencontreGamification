security:
    password_hashers:
        App\Entity\User:
            algorithm: auto

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # 🔓 ROUTES PUBLIQUES — AUCUNE AUTHENTIFICATION
        public:
            pattern: ^/api/(register|login)
            stateless: true
            security: false

        # 🔐 ROUTES PROTÉGÉES
        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            custom_authenticator: App\Security\JWTAuthenticator

    access_control:
        # Public
        - { path: ^/api/register, roles: PUBLIC_ACCESS }
        - { path: ^/api/login, roles: PUBLIC_ACCESS }

        # Admin
        - { path: ^/api/admin, roles: ROLE_ADMIN }

        # Privé
        - { path: ^/api, roles: ROLE_USER }
